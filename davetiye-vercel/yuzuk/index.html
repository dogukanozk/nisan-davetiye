<body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Jost:wght@300;400;500&display=swap">
<style>
/* Layout: üstte birbirine kenetlenen iki yüzük, altında yazılar. Tek tema (şampanya). */
:root{--cover-font:italic 400 44px/1.15 var(--f-disp);--btn-bg:#2e3a32;--btn-fg:#fffcf7;--bg:#efe8de;--paper:#fffcf7;--ink:#2e3a32;--mute:#7c8079;--gold:#b48f55;--blush:#efd7cf;
--f-disp:"Bodoni Moda",Didot,"Times New Roman",serif;--f-sans:"Jost","Helvetica Neue",Arial,sans-serif;color-scheme:light}
.stage{border-radius:6px;box-shadow:0 18px 44px rgba(46,58,50,.12);padding:30px 26px 38px}
.halo{position:absolute;left:50%;top:10px;width:360px;height:260px;transform:translateX(-50%);background:radial-gradient(closest-side,var(--blush),transparent);opacity:.7}
.rings{position:relative;width:78%;max-width:300px;display:block;margin:0 auto;animation:bob 4s ease-in-out 2.4s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.r1{animation:inL 1.6s cubic-bezier(.2,.7,.2,1) .2s both}
.r2{animation:inR 1.6s cubic-bezier(.2,.7,.2,1) .2s both}
.lock{animation:fadeIn .3s 1.7s both}
@keyframes inL{from{transform:translateX(-60px);opacity:0}to{transform:none;opacity:1}}
@keyframes inR{from{transform:translateX(60px);opacity:0}to{transform:none;opacity:1}}
.gem{transform-box:fill-box;transform-origin:center;animation:gem 1s 1.8s cubic-bezier(.3,1.6,.5,1) both}
@keyframes gem{from{transform:scale(0)}to{transform:scale(1)}}
.st{transform-box:fill-box;transform-origin:center;animation:tw 2.4s ease-in-out infinite}
.kick{font:500 11px/1.4 var(--f-sans);letter-spacing:.34em;text-transform:uppercase;color:var(--gold);margin:14px 0 0}
.fam{font:300 15px/1.55 var(--f-sans);color:var(--mute);margin:14px auto 0;max-width:30ch}
.names{font:italic 400 44px/1.1 var(--f-disp);margin:16px 0 0;font-weight:400}
.names span{display:block;font:400 22px/1 var(--f-disp);color:var(--gold);margin:6px 0}
.date .day{font:400 54px/1 var(--f-disp)}
.place{font:italic 400 22px/1.3 var(--f-disp);margin:26px 0 0}
.btn-loc{background:var(--ink);color:var(--paper)}
.cd b{font:400 26px/1 var(--f-disp)}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
.stage{max-width:440px;margin:0 auto;background:var(--paper);text-align:center;position:relative;overflow:hidden}
@media (max-width:480px){body{padding-left:0;padding-right:0;padding-block:0}.stage{min-height:100vh;box-shadow:none!important;border-radius:0!important}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes drawL{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
.rv{animation:up 1s cubic-bezier(.2,.7,.2,1) var(--d,0s) both}
.btn-loc{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font:500 12.5px/1 var(--f-sans);letter-spacing:.14em;text-transform:uppercase;padding:14px 22px;border-radius:999px;margin-top:18px}
.btn-loc svg{width:16px;height:16px}
.btn-loc:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.cd{display:flex;justify-content:center;gap:14px;font-variant-numeric:tabular-nums;margin-top:26px}
.cd div{display:flex;flex-direction:column;align-items:center;min-width:44px}
.cd span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-top:5px;opacity:.75}
.date{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin:28px 0 0}
.date .side{font:500 12px/1.4 var(--f-sans);letter-spacing:.2em;text-transform:uppercase;border-block:1px solid var(--gold);padding:8px 0}
.date .day small{display:block;font:500 11px/1 var(--f-sans);letter-spacing:.24em;text-transform:uppercase;margin-top:6px;color:var(--gold)}
.addr{font:400 13.5px/1.55 var(--f-sans);margin:6px 0 0;opacity:.75}
/* kapak: dokunana kadar tüm animasyonlar bekler */
.stage:not(.play)>:not(.cover),.stage:not(.play)>:not(.cover) *{animation-play-state:paused!important}
.cover{position:absolute;inset:0;z-index:20;background:var(--cover-bg,var(--paper));display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:30vh 24px 0;transition:opacity .8s,visibility .8s}
@media (min-width:481px){.cover{padding-top:240px}}
.stage.play .cover{opacity:0;visibility:hidden}
.cover .ck{font:500 11px/1.4 var(--f-sans);letter-spacing:.32em;text-transform:uppercase;color:var(--gold);margin:0;animation:up 1s .2s both}
.cover .cn{font:var(--cover-font);margin:14px 0 0;color:var(--ink);animation:up 1s .45s both}
.cover .cd8{font:400 14px/1 var(--f-sans);letter-spacing:.2em;margin:14px 0 0;color:var(--gold);animation:up 1s .7s both}
.cover button{margin-top:30px;font:500 12.5px/1 var(--f-sans);letter-spacing:.2em;text-transform:uppercase;border:0;border-radius:999px;padding:16px 28px;cursor:pointer;background:var(--btn-bg);color:var(--btn-fg);animation:up 1s .95s both,pulse 2.4s ease-in-out 2s infinite}
.cover button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--gold) 55%,transparent)}50%{box-shadow:0 0 0 14px transparent}}
.dust{position:absolute;bottom:-10px;border-radius:50%;background:var(--dust,var(--gold));opacity:0;pointer-events:none;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}12%{opacity:.85}85%{opacity:.5}100%{transform:translateY(-1100px);opacity:0}}
.replay{margin-top:22px;font:500 11px/1 var(--f-sans);letter-spacing:.16em;text-transform:uppercase;background:none;border:0;cursor:pointer;color:inherit;opacity:.6;padding:8px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

</style>
<main class="stage" lang="tr" data-dust="22"><div class="cover"><p class="ck">Nişanımıza Davetlisiniz</p><p class="cn">İlayda &amp; Yahya Yasin</p><p class="cd8">27 · 10 · 2026</p><button type="button">Davetiyeyi Aç</button></div><div class="halo" aria-hidden="true"></div><svg class="rings" viewBox="20 6 160 116" role="img" aria-label="Birbirine geçmiş iki nişan yüzüğü">
  <defs>
    <linearGradient id="gd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3dfaa"/><stop offset=".35" stop-color="#c79c55"/><stop offset=".6" stop-color="#f6e6b8"/><stop offset="1" stop-color="#a97f3e"/><animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="5s" repeatCount="indefinite"/></linearGradient>
    <linearGradient id="gm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#e7f0f6"/><stop offset="1" stop-color="#b9cbd8"/></linearGradient>
  </defs>
  <g class="r2"><circle cx="118" cy="70" r="30" fill="none" stroke="url(#gd)" stroke-width="6"/>
    <g class="gem"><path d="M118 28l-8 8 8 10 8-10z" fill="url(#gm)" stroke="#a9bccb" stroke-width=".6"/><path d="M110 36h16M118 28v18" stroke="#c9d8e3" stroke-width=".5"/><rect x="114" y="38" width="8" height="2" fill="#c79c55" opacity="0"/></g></g>
  <g class="r1"><circle cx="82" cy="70" r="30" fill="none" stroke="url(#gd)" stroke-width="6"/></g>
  <path class="lock" d="M105 89.3A30 30 0 0 1 92.3 98.2" fill="none" stroke="url(#gd)" stroke-width="6"/>
  <g fill="#e2c27c"><path class="st" style="animation-delay:2s" d="M140 22l2.4 6 6 2.4-6 2.4-2.4 6-2.4-6-6-2.4 6-2.4z"/>
  <path class="st" style="animation-delay:2.8s" d="M58 34l1 3 3 1-3 1-1 3-1-3-3-1 3-1z"/><path class="st" style="animation-delay:3.4s" d="M152 92l1 2.6 2.6 1-2.6 1-1 2.6-1-2.6-2.6-1 2.6-1z"/></g>
</svg><p class="kick rv" style="--d:1.90s">Nişanımıza Davetlisiniz</p>
    <p class="fam rv" style="--d:2.00s">Saran ve Bingöl ailelerinin kıymetli evlatları</p>
    <h1 class="names rv" style="--d:2.15s">İlayda<span>&amp;</span>Yahya Yasin</h1>
    <div class="date rv" style="--d:2.35s"><div class="side">Salı</div><div class="day">27<small>Ekim 2026</small></div><div class="side">19.00</div></div>
    <p class="place rv" style="--d:2.50s">Akman Rönesans</p>
    <p class="addr rv" style="--d:2.55s">Konutkent Mahallesi 2961. Cadde No:1/B<br>Çankaya / Ankara</p>
    <div class="rv" style="--d:2.65s"><a class="btn-loc" href="https://www.google.com/maps/search/?api=1&amp;query=Akman%20R%C3%B6nesans%2C%20Konutkent%20Mahallesi%202961.%20Cadde%20No%3A1%2FB%2C%20%C3%87ankaya%2C%20Ankara" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Konuma Git</a></div>
    <div class="cd rv" style="--d:2.75s"></div>
    <button class="replay rv" style="--d:2.85s" type="button">↺ Tekrar izle</button></main>
<script>(function(){var t=new Date('2026-10-27T19:00:00+03:00').getTime(),els=document.querySelectorAll('.cd');function p(n){return n<10?'0'+n:''+n}
function k(){var ms=Math.max(0,t-Date.now()),d=Math.floor(ms/864e5),h=Math.floor(ms/36e5)%24,m=Math.floor(ms/6e4)%60,s=Math.floor(ms/1e3)%60;
var h2=ms>0?'<div><b>'+d+'</b><span>Gün</span></div><div><b>'+p(h)+'</b><span>Saat</span></div><div><b>'+p(m)+'</b><span>Dakika</span></div><div><b>'+p(s)+'</b><span>Saniye</span></div>':'<div><b>♥</b><span>Bugün</span></div>';
els.forEach(function(e){e.innerHTML=h2})}k();setInterval(k,1000)})();
(function(){var st=document.querySelector('.stage'),cv=st.querySelector('.cover');
if(st.dataset.dust){for(var i=0;i<+st.dataset.dust;i++){var d=document.createElement('span');d.className='dust';var z=2+Math.random()*3;d.style.width=d.style.height=z+'px';d.style.left=(Math.random()*100)+'%';d.style.animationDuration=(9+Math.random()*9)+'s';d.style.animationDelay=(-Math.random()*16)+'s';st.appendChild(d);}}
cv.querySelector('button').addEventListener('click',function(){st.classList.add('play');window.scrollTo({top:0,behavior:'smooth'})});
var rp=st.querySelector('.replay');if(rp)rp.addEventListener('click',function(){st.classList.remove('play');
 if(document.getAnimations)document.getAnimations().forEach(function(a){if(a.effect&&a.effect.target&&!cv.contains(a.effect.target)){try{a.cancel();a.play()}catch(e){}}});
 window.scrollTo({top:0})});
})();</script>
</body>
