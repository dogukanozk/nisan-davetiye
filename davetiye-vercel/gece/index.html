<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: telefon genişliğinde tek sahne. Açılış = salonun suluboya illüstrasyonu + isimler; dokununca davetiye kartı açılır. Tek tema (kağıt), bilinçli. */
:root{
  --page:#0a1328; --paper:#121f3c; --ink:#f0e7d0; --mute:#a9b2c7;
  --sage:#d2b06a; --rose:#e2c27c; --blush:#e8b4b8; --gold:#d6b46a;
  --f-script:"Great Vibes","Brush Script MT",cursive;
  --f-serif:"Cormorant Garamond","Garamond","Times New Roman",serif;
  --f-sans:"Jost","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--page);color:var(--ink)}
body{font-family:var(--f-sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
.stage{max-width:440px;margin:0 auto;background:var(--paper);border-radius:20px;overflow:hidden;position:relative;box-shadow:0 18px 50px rgba(0,0,0,.5)}
@media (max-width:480px){body{padding-left:0;padding-right:0;padding-block:0}.stage{border-radius:0;box-shadow:none}}

/* ---- Açılış ---- */
.cover{position:relative;transition:opacity .7s,transform .9s cubic-bezier(.5,0,.3,1)}
.cover.out{opacity:0;transform:translateY(-30px)}
.art{display:block;width:100%;height:auto}
.cover-text{text-align:center;padding:4px 20px 34px;position:relative}
.kick{font:500 11px/1.4 var(--f-sans);letter-spacing:.32em;text-transform:uppercase;color:var(--sage);margin:0}
.names{font:400 46px/1.1 var(--f-script);color:var(--ink);margin:6px 0 4px}
.names i{font:italic 400 24px/1 var(--f-serif);color:var(--gold);padding:0 6px}
.when{font:italic 500 18px/1.4 var(--f-serif);margin:0;color:var(--mute)}
.open{margin-top:20px;font:500 12.5px/1 var(--f-sans);letter-spacing:.2em;text-transform:uppercase;color:var(--paper);background:linear-gradient(100deg,#c9a55c,#f0d898,#c9a55c);border:0;border-radius:999px;padding:15px 26px;cursor:pointer;animation:breathe 2.6s ease-in-out 3.6s infinite}
.open:focus-visible,.back:focus-visible,.btn-loc:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(214,180,106,.45)}50%{box-shadow:0 0 0 12px rgba(214,180,106,0)}}

/* illüstrasyon katmanları */
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:700}to{stroke-dashoffset:0}}
@keyframes sway{0%,100%{transform:skewX(0)}50%{transform:skewX(1.6deg)}}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes twinkle{0%,100%{opacity:0}50%{opacity:1}}
.L{transform-box:fill-box;transform-origin:50% 100%}
.sky{animation:fade 1.4s both}
.bld{animation:up 1.2s .3s both}
.trees{animation:up 1.2s .5s both}
.lawn{animation:fade 1.2s .2s both}
.beds{animation:fade 1s .9s both}
.chairs{animation:up 1s 1.1s both}
.perg path{stroke-dasharray:700;animation:draw 2.2s .9s ease-out both}
.drape{animation:fade 1.2s 2s both}
.drape-in{transform-box:fill-box;transform-origin:50% 0;animation:sway 6s ease-in-out 3s infinite}
.lamps{animation:fade 1s 1.6s both}
.halo{animation:glow 3.4s ease-in-out infinite}
.couple{animation:up 1.4s 2.2s both}
.bush{animation:up 1.2s 1.4s both}
.spark{animation:twinkle 2.4s ease-in-out infinite}
.cover-text>*{animation:up 1s both}
.cover-text>:nth-child(1){animation-delay:2.7s}.cover-text>:nth-child(2){animation-delay:2.9s}.cover-text>:nth-child(3){animation-delay:3.1s}.cover-text>:nth-child(4){animation-delay:3.3s}
.petal{position:absolute;top:-20px;width:10px;height:12px;border-radius:10px 0 10px 0;background:#eab9bd;opacity:.8;pointer-events:none;z-index:3;animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--dx,40px),760px) rotate(var(--r,360deg))}}

/* ---- Kart ---- */
.card{text-align:center;padding:38px 26px 34px;position:relative}
.card::before{content:"";position:absolute;inset:12px;border:1px solid var(--gold);pointer-events:none}
.card::after{content:"";position:absolute;inset:16px;border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);pointer-events:none}
.card .rv{animation:up 1s cubic-bezier(.2,.7,.2,1) var(--d,0s) both}
.orn{width:84px;height:auto;color:var(--gold);display:block;margin:6px auto 0}
.c-kick{font:500 11px/1.4 var(--f-sans);letter-spacing:.32em;text-transform:uppercase;color:var(--rose);margin:16px 0 0}
.fam{font:italic 400 19px/1.45 var(--f-serif);margin:16px auto 0;max-width:28ch}
.c-names{font:400 56px/1.02 var(--f-script);margin:14px 0 0;color:var(--ink)}
.c-names em{display:block;font:italic 400 22px/1 var(--f-serif);color:var(--gold);margin:4px 0}
.date{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin:28px 0 0}
.date .side{font:500 12px/1.4 var(--f-sans);letter-spacing:.2em;text-transform:uppercase;border-block:1px solid var(--gold);padding:8px 0}
.date .day{font:500 56px/1 var(--f-serif)}
.date .day small{display:block;font:500 11.5px/1 var(--f-sans);letter-spacing:.24em;text-transform:uppercase;margin-top:5px;color:var(--gold)}
.place{font:600 21px/1.3 var(--f-serif);margin:26px 0 0;letter-spacing:.03em}
.addr{font:400 13.5px/1.55 var(--f-sans);color:var(--mute);margin:6px 0 0}
.btn-loc{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font:500 12.5px/1 var(--f-sans);letter-spacing:.14em;text-transform:uppercase;padding:14px 22px;border-radius:999px;background:var(--sage);color:var(--paper);margin-top:18px}
.btn-loc svg{width:16px;height:16px}
.cd{display:flex;justify-content:center;gap:14px;font-variant-numeric:tabular-nums;margin-top:26px}
.cd div{display:flex;flex-direction:column;align-items:center;min-width:44px}
.cd b{font:500 26px/1 var(--f-serif)}
.cd span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-top:5px;color:var(--mute)}
.back{margin-top:24px;font:500 11px/1 var(--f-sans);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);background:none;border:0;cursor:pointer;padding:8px}

.rays{transform-origin:200px 292px;animation:spin 40s linear infinite,raypulse 3s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes raypulse{0%,100%{opacity:.08}50%{opacity:.28}}
.chalo,.chalo2{transform-box:fill-box;transform-origin:center;animation:cpulse 3s ease-in-out infinite}
.chalo2{animation-duration:3.2s}
@keyframes cpulse{0%,100%{transform:scale(.96);opacity:.7}50%{transform:scale(1.04);opacity:.9}}
.cbody{animation:flick 2.6s ease-in-out infinite}
@keyframes flick{0%,100%{opacity:.93}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .petal{display:none}
}
</style>

  function openCard(){
    cover.classList.add('out');
    setTimeout(function(){cover.hidden=true;card.hidden=false;stage.scrollIntoView({behavior:'smooth',block:'start'});},650);
  }
  cover.querySelector('#openBtn').addEventListener('click',openCard);
  document.getElementById('backBtn').addEventListener('click',function(){
    var c=cover.cloneNode(true); c.classList.remove('out'); c.hidden=false;
    cover.parentNode.replaceChild(c,cover); cover=c;
    cover.querySelector('#openBtn').addEventListener('click',openCard);
    card.hidden=true; stage.scrollIntoView({behavior:'smooth',block:'start'});
  });
})();
</script>

</body>
</html>
