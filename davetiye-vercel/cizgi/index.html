<style>
/* Layout: tek sütun; üstte kendini çizen altın çizgi kemerler, altında yazılar. Tek tema (açık). */
:root{--bg:#f7f3ec;--paper:#fdfbf7;--ink:#2b2f2a;--mute:#7d7f78;--gold:#b08f4f;--sage:#7f9473;--blush:#ecd3d0;
--f-disp:"Playfair Display",Georgia,serif;--f-sans:"Jost","Helvetica Neue",Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes drawL{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes glowP{0%,100%{opacity:.6;transform:scale(.96)}50%{opacity:.9;transform:scale(1.04)}}
.tw{animation:tw 2.6s ease-in-out infinite}
.glowC{transform-box:fill-box;transform-origin:center;animation:glowP 3.2s ease-in-out infinite}
.btn-loc{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font:500 12.5px/1 var(--f-sans);letter-spacing:.14em;text-transform:uppercase;padding:14px 22px;border-radius:999px}
.btn-loc svg{width:16px;height:16px}
.btn-loc:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.cd{display:flex;justify-content:center;gap:14px;font-variant-numeric:tabular-nums}
.cd div{display:flex;flex-direction:column;align-items:center;min-width:44px}
.cd span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-top:5px;opacity:.75}

html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
.stage{max-width:440px;margin:0 auto;background:var(--paper);border-radius:4px;box-shadow:0 18px 44px rgba(43,47,42,.1);padding:34px 26px 38px;text-align:center;position:relative;overflow:hidden}
@media (max-width:480px){body{padding-left:0;padding-right:0;padding-block:0}.stage{border-radius:0;box-shadow:none;min-height:100vh}}
.wash{position:absolute;left:50%;top:40px;width:340px;height:240px;transform:translateX(-50%);background:radial-gradient(closest-side,var(--blush),transparent);opacity:.55;pointer-events:none}
.arches{position:relative;width:100%;display:block}
.dr path,.dr ellipse{stroke-dasharray:1;stroke-dashoffset:1;animation:drawL 2.6s ease-out forwards}
.dr2 path{animation-delay:.9s;animation-duration:2s}
.dr3 path,.dr3 ellipse{animation-delay:1.8s;animation-duration:1.4s}
.glowC{animation:glowP 3.2s ease-in-out 2.6s infinite,fadeIn 1s 2.4s both}
.dots{animation:fadeIn 1s 2.6s both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.rv{animation:up 1s cubic-bezier(.2,.7,.2,1) calc(var(--d,0s) + 1.6s) both}
.kick{font:500 11px/1.4 var(--f-sans);letter-spacing:.34em;text-transform:uppercase;color:var(--sage);margin:18px 0 0}
.fam{font:300 15px/1.55 var(--f-sans);color:var(--mute);margin:14px auto 0;max-width:30ch}
.names{font:italic 400 46px/1.08 var(--f-disp);margin:14px 0 0;color:var(--ink)}
.names em{display:block;font:400 13px/1 var(--f-sans);font-style:normal;letter-spacing:.4em;color:var(--gold);margin:12px 0}
.date{display:flex;justify-content:center;align-items:center;gap:16px;margin:28px 0 0}
.date .side{font:400 12px/1.4 var(--f-sans);letter-spacing:.24em;text-transform:uppercase;color:var(--mute);min-width:64px}
.date .day{font:italic 400 58px/1 var(--f-disp);border-inline:1px solid var(--gold);padding:0 18px}
.date .day small{display:block;font:500 11px/1 var(--f-sans);font-style:normal;letter-spacing:.24em;text-transform:uppercase;margin-top:8px;color:var(--gold)}
.place{font:italic 500 21px/1.3 var(--f-disp);margin:28px 0 0}
.addr{font:300 14px/1.55 var(--f-sans);color:var(--mute);margin:6px 0 0}
.btn-loc{background:transparent;color:var(--ink);border:1px solid var(--gold);margin-top:18px}
.btn-loc:hover{background:var(--gold);color:var(--paper)}
.cd{margin-top:26px} .cd b{font:italic 400 28px/1 var(--f-disp)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (prefers-reduced-motion:reduce){.dr path,.dr ellipse{stroke-dashoffset:0!important}}

var h2=ms>0?'<div><b>'+d+'</b><span>Gün</span></div><div><b>'+p(h)+'</b><span>Saat</span></div><div><b>'+p(m)+'</b><span>Dakika</span></div><div><b>'+p(s)+'</b><span>Saniye</span></div>':'<div><b>♥</b><span>Bugün</span></div>';
els.forEach(function(e){e.innerHTML=h2})}k();setInterval(k,1000)})();</script>
