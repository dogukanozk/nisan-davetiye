<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<body>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap">
<style>
/* Layout: siyah zemin, art-deco çerçeve kendini çizer, ortada altın monogram. Tek tema (koyu). */
:root{--cover-font:400 28px/1.3 var(--f-deco);--btn-bg:linear-gradient(100deg,#c9a55c,#f0d898,#c9a55c);--btn-fg:#17181c;--bg:#0f1012;--paper:#17181c;--ink:#efe7d6;--mute:#a7a29a;--gold:#cfae6b;--gold2:#f2deaa;
--f-deco:"Cinzel","Trajan Pro",serif;--f-serif:"Cormorant Garamond",Garamond,serif;--f-sans:"Jost","Helvetica Neue",Arial,sans-serif;color-scheme:dark}
.stage{padding:40px 28px 44px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.frame{position:absolute;inset:14px;width:calc(100% - 28px);height:calc(100% - 28px);pointer-events:none}
.frame rect{fill:none;stroke:var(--gold);stroke-width:1;stroke-dasharray:1;stroke-dashoffset:1;animation:drawL 2.4s ease-out forwards}
.frame rect+rect{animation-delay:.4s;opacity:.5}
.frame .trace{stroke:var(--gold2);stroke-width:2;stroke-dasharray:.06 .94;opacity:1;animation:trace 6s linear 2.4s infinite;filter:drop-shadow(0 0 4px var(--gold2))}
@keyframes trace{from{stroke-dashoffset:0}to{stroke-dashoffset:-1}}
.mono{animation:glowM 3.2s ease-in-out 2.4s infinite}
@keyframes glowM{0%,100%{filter:drop-shadow(0 0 0 transparent)}50%{filter:drop-shadow(0 0 14px rgba(242,222,170,.45))}}
.deco{width:180px;display:block;margin:0 auto;color:var(--gold)}
.deco path{stroke-dasharray:1;stroke-dashoffset:1;animation:drawL 1.8s .3s ease-out forwards}
.mono{position:relative;width:150px;height:150px;margin:6px auto 0;display:grid;place-items:center}
.mono svg{position:absolute;inset:0}
.mono circle{fill:none;stroke:var(--gold);stroke-width:1;stroke-dasharray:1;stroke-dashoffset:1;animation:drawL 2s .6s ease-out forwards}
.mono circle+circle{stroke-width:.5;animation-delay:.9s}
.mono b{font:400 58px/1 var(--f-deco);letter-spacing:.02em;animation:fadeIn 1.4s 1.2s both;display:flex;align-items:center;gap:2px}
.mono i{font:italic 400 30px/1 var(--f-serif);margin:0 2px}
.gold{background:linear-gradient(100deg,var(--gold) 0%,var(--gold2) 30%,var(--gold) 50%,#a8844a 75%,var(--gold2) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite}
@keyframes shine{from{background-position:0 0}to{background-position:-250% 0}}
.kick{font:400 11.5px/1.5 var(--f-deco);letter-spacing:.36em;color:var(--gold);margin:22px 0 0}
.fam{font:italic 400 18px/1.5 var(--f-serif);color:var(--mute);margin:14px auto 0;max-width:28ch}
.names{font:400 30px/1.25 var(--f-deco);letter-spacing:.08em;margin:18px 0 0}
.names span{display:block;font:italic 400 26px/1 var(--f-serif);margin:6px 0;color:var(--gold)}
.date .side{border-color:color-mix(in srgb,var(--gold) 60%,transparent)}
.date .day{font:400 50px/1 var(--f-deco);color:var(--gold2)}
.place{font:400 15px/1.4 var(--f-deco);letter-spacing:.24em;margin:28px 0 0;color:var(--gold2)}
.btn-loc{background:linear-gradient(100deg,#c9a55c,#f0d898,#c9a55c);color:#17181c}
.cd b{font:400 24px/1 var(--f-deco);color:var(--gold2)}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
.stage{max-width:440px;margin:0 auto;background:var(--paper);text-align:center;position:relative;overflow:hidden}
@media (max-width:480px){body{padding-left:0;padding-right:0;padding-block:0}.stage{min-height:100vh;box-shadow:none!important;border-radius:0!important}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes drawL{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
.rv{animation:up 1s cubic-bezier(.2,.7,.2,1) var(--d,0s) both}
.btn-loc{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font:500 12.5px/1 var(--f-sans);letter-spacing:.14em;text-transform:uppercase;padding:14px 22px;border-radius:999px;margin-top:18px}
.btn-loc svg{width:16px;height:16px}
.btn-loc:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.cd{display:flex;justify-content:center;gap:14px;font-variant-numeric:tabular-nums;margin-top:26px}
.cd div{display:flex;flex-direction:column;align-items:center;min-width:44px}
.cd span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-top:5px;opacity:.75}
.date{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin:28px 0 0}
.date .side{font:500 12px/1.4 var(--f-sans);letter-spacing:.2em;text-transform:uppercase;border-block:1px solid var(--gold);padding:8px 0}
.date .day small{display:block;font:500 11px/1 var(--f-sans);letter-spacing:.24em;text-transform:uppercase;margin-top:6px;color:var(--gold)}
.addr{font:400 13.5px/1.55 var(--f-sans);margin:6px 0 0;opacity:.75}
/* kapak: dokunana kadar tüm animasyonlar bekler */
.stage:not(.play)>:not(.cover),.stage:not(.play)>:not(.cover) *{animation-play-state:paused!important}
.cover{position:absolute;inset:0;z-index:20;background:var(--cover-bg,var(--paper));display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:30vh 24px 0;transition:opacity .8s,visibility .8s}
@media (min-width:481px){.cover{padding-top:240px}}
.stage.play .cover{opacity:0;visibility:hidden}
.cover .ck{font:500 11px/1.4 var(--f-sans);letter-spacing:.32em;text-transform:uppercase;color:var(--gold);margin:0;animation:up 1s .2s both}
.cover .cn{font:var(--cover-font);margin:14px 0 0;color:var(--ink);animation:up 1s .45s both}
.cover .cd8{font:400 14px/1 var(--f-sans);letter-spacing:.2em;margin:14px 0 0;color:var(--gold);animation:up 1s .7s both}
.cover button{margin-top:30px;font:500 12.5px/1 var(--f-sans);letter-spacing:.2em;text-transform:uppercase;border:0;border-radius:999px;padding:16px 28px;cursor:pointer;background:var(--btn-bg);color:var(--btn-fg);animation:up 1s .95s both,pulse 2.4s ease-in-out 2s infinite}
.cover button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--gold) 55%,transparent)}50%{box-shadow:0 0 0 14px transparent}}
.dust{position:absolute;bottom:-10px;border-radius:50%;background:var(--dust,var(--gold));opacity:0;pointer-events:none;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}12%{opacity:.85}85%{opacity:.5}100%{transform:translateY(-1100px);opacity:0}}
.replay{margin-top:22px;font:500 11px/1 var(--f-sans);letter-spacing:.16em;text-transform:uppercase;background:none;border:0;cursor:pointer;color:inherit;opacity:.6;padding:8px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

</style>
<main class="stage" lang="tr" data-dust="26"><div class="cover"><p class="ck">Nişanımıza Davetlisiniz</p><p class="cn"><span class="gold" style="color:transparent">İLAYDA &amp; YAHYA YASİN</span></p><p class="cd8">27 · 10 · 2026</p><button type="button">Davetiyeyi Aç</button></div>
  <svg class="frame" preserveAspectRatio="none" aria-hidden="true"><rect x=".5" y=".5" width="99.6%" height="99.7%" pathLength="1"/><rect x="6" y="6" width="96%" height="98.4%" pathLength="1" style="width:calc(100% - 12px);height:calc(100% - 12px)"/><rect class="trace" x=".5" y=".5" width="99.6%" height="99.7%" pathLength="1"/></svg>
  <svg class="deco" viewBox="0 0 180 36" fill="none" stroke="currentColor" stroke-width=".9" aria-hidden="true">
    <path pathLength="1" d="M90 34V4M90 34 70 8M90 34 110 8M90 34 54 16M90 34 126 16M90 34 42 28M90 34 138 28"/>
    <path pathLength="1" d="M0 34H70M110 34H180M10 30H66M114 30H170"/>
  </svg>
  <div class="mono"><svg viewBox="0 0 150 150" aria-hidden="true"><circle cx="75" cy="75" r="70" pathLength="1"/><circle cx="75" cy="75" r="64" pathLength="1"/></svg>
    <b class="gold">İ<i class="gold">&amp;</i>Y</b></div>
  <p class="kick rv" style="--d:1.40s">Nişanımıza Davetlisiniz</p>
    <p class="fam rv" style="--d:1.50s">Saran ve Bingöl ailelerinin kıymetli evlatları</p>
    <h1 class="names rv" style="--d:1.65s"><span class="gold" style="display:inline;font:inherit;letter-spacing:inherit;color:transparent">İLAYDA</span><span>&amp;</span><span class="gold" style="display:inline;font:inherit;letter-spacing:inherit;color:transparent">YAHYA YASİN</span></h1>
    <div class="date rv" style="--d:1.85s"><div class="side">Salı</div><div class="day">27<small>Ekim 2026</small></div><div class="side">19.00</div></div>
    <p class="place rv" style="--d:2.00s">Akman Rönesans</p>
    <p class="addr rv" style="--d:2.05s">Konutkent Mahallesi 2961. Cadde No:1/B<br>Çankaya / Ankara</p>
    <div class="rv" style="--d:2.15s"><a class="btn-loc" href="https://www.google.com/maps/search/?api=1&amp;query=Akman%20R%C3%B6nesans%2C%20Konutkent%20Mahallesi%202961.%20Cadde%20No%3A1%2FB%2C%20%C3%87ankaya%2C%20Ankara" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Konuma Git</a></div>
    <div class="cd rv" style="--d:2.25s"></div>
    <button class="replay rv" style="--d:2.35s" type="button">↺ Tekrar izle</button>
</main>
<script>(function(){var t=new Date('2026-10-27T19:00:00+03:00').getTime(),els=document.querySelectorAll('.cd');function p(n){return n<10?'0'+n:''+n}
function k(){var ms=Math.max(0,t-Date.now()),d=Math.floor(ms/864e5),h=Math.floor(ms/36e5)%24,m=Math.floor(ms/6e4)%60,s=Math.floor(ms/1e3)%60;
var h2=ms>0?'<div><b>'+d+'</b><span>Gün</span></div><div><b>'+p(h)+'</b><span>Saat</span></div><div><b>'+p(m)+'</b><span>Dakika</span></div><div><b>'+p(s)+'</b><span>Saniye</span></div>':'<div><b>♥</b><span>Bugün</span></div>';
els.forEach(function(e){e.innerHTML=h2})}k();setInterval(k,1000)})();
(function(){var st=document.querySelector('.stage'),cv=st.querySelector('.cover');
if(st.dataset.dust){for(var i=0;i<+st.dataset.dust;i++){var d=document.createElement('span');d.className='dust';var z=2+Math.random()*3;d.style.width=d.style.height=z+'px';d.style.left=(Math.random()*100)+'%';d.style.animationDuration=(9+Math.random()*9)+'s';d.style.animationDelay=(-Math.random()*16)+'s';st.appendChild(d);}}
cv.querySelector('button').addEventListener('click',function(){st.classList.add('play');window.scrollTo({top:0,behavior:'smooth'})});
var rp=st.querySelector('.replay');if(rp)rp.addEventListener('click',function(){st.classList.remove('play');
 if(document.getAnimations)document.getAnimations().forEach(function(a){if(a.effect&&a.effect.target&&!cv.contains(a.effect.target)){try{a.cancel();a.play()}catch(e){}}});
 window.scrollTo({top:0})});
})();</script>
</body>
