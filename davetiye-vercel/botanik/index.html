<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&family=Jost:wght@300;400;500&display=swap">
<style>
/* Layout: köşelerden büyüyen suluboya çiçekler ve okaliptüs dalları; ortada yazılar; düşen yapraklar. Tek tema (açık). */
:root{--cover-font:400 54px/1.1 var(--f-script);--btn-bg:#c4737f;--btn-fg:#fff;--dust:#efc3c4;--bg:#f3ebe6;--paper:#fffaf7;--ink:#4a3a3d;--mute:#8a7a7c;--gold:#b98d6a;--rose:#c4737f;--sage:#8aa18a;
--f-script:"Great Vibes","Brush Script MT",cursive;--f-serif:"Cormorant Garamond",Garamond,serif;--f-sans:"Jost","Helvetica Neue",Arial,sans-serif;color-scheme:light}
.stage{border-radius:6px;box-shadow:0 18px 44px rgba(74,58,61,.12);padding:150px 26px 170px}
.bot{position:absolute;width:250px;height:250px;pointer-events:none}
.bot.tl{left:-30px;top:-30px}
.bot.br{right:-30px;bottom:-30px;transform:rotate(180deg)}
.stem{fill:none;stroke:#7e9682;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:drawL 2s ease-out forwards}
.leaf,.bloom{transform-box:fill-box;transform-origin:center;animation:pop .9s cubic-bezier(.3,1.4,.5,1) both}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.bloom-in{transform-box:fill-box;transform-origin:center;animation:breathe 6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:rotate(-5deg) scale(1)}50%{transform:rotate(6deg) scale(1.05)}}
.bot{animation:sway 7s ease-in-out infinite}
.bot.br{animation-name:sway2}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(2.5deg)}}
@keyframes sway2{0%,100%{transform:rotate(180deg)}50%{transform:rotate(182.5deg)}}
.petal{position:absolute;top:-20px;width:14px;height:16px;z-index:5;border-radius:11px 0 11px 0;background:#efc3c4;opacity:.8;pointer-events:none;animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--dx,40px),1100px) rotate(var(--r,360deg))}}
.kick{font:500 11px/1.4 var(--f-sans);letter-spacing:.34em;text-transform:uppercase;color:var(--rose);margin:0}
.fam{font:italic 400 18px/1.5 var(--f-serif);color:var(--mute);margin:14px auto 0;max-width:28ch}
.names{font:400 56px/1.05 var(--f-script);margin:14px 0 0;color:var(--ink);font-weight:400}
.names span{display:block;font:italic 400 22px/1 var(--f-serif);color:var(--gold);margin:4px 0}
.date .day{font:500 54px/1 var(--f-serif)}
.place{font:600 21px/1.3 var(--f-serif);margin:26px 0 0}
.btn-loc{background:var(--rose);color:#fff}
.cd b{font:500 26px/1 var(--f-serif)}
@media (prefers-reduced-motion:reduce){.stem{stroke-dashoffset:0}.petal{display:none}}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
.stage{max-width:440px;margin:0 auto;background:var(--paper);text-align:center;position:relative;overflow:hidden}
@media (max-width:480px){body{padding-left:0;padding-right:0;padding-block:0}.stage{min-height:100vh;box-shadow:none!important;border-radius:0!important}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes drawL{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
.rv{animation:up 1s cubic-bezier(.2,.7,.2,1) var(--d,0s) both}
.btn-loc{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font:500 12.5px/1 var(--f-sans);letter-spacing:.14em;text-transform:uppercase;padding:14px 22px;border-radius:999px;margin-top:18px}
.btn-loc svg{width:16px;height:16px}
.btn-loc:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.cd{display:flex;justify-content:center;gap:14px;font-variant-numeric:tabular-nums;margin-top:26px}
.cd div{display:flex;flex-direction:column;align-items:center;min-width:44px}
.cd span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-top:5px;opacity:.75}
.date{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin:28px 0 0}
.date .side{font:500 12px/1.4 var(--f-sans);letter-spacing:.2em;text-transform:uppercase;border-block:1px solid var(--gold);padding:8px 0}
.date .day small{display:block;font:500 11px/1 var(--f-sans);letter-spacing:.24em;text-transform:uppercase;margin-top:6px;color:var(--gold)}
.addr{font:400 13.5px/1.55 var(--f-sans);margin:6px 0 0;opacity:.75}
/* kapak: dokunana kadar tüm animasyonlar bekler */
.stage:not(.play)>:not(.cover),.stage:not(.play)>:not(.cover) *{animation-play-state:paused!important}
.cover{position:absolute;inset:0;z-index:20;background:var(--cover-bg,var(--paper));display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:30vh 24px 0;transition:opacity .8s,visibility .8s}
@media (min-width:481px){.cover{padding-top:240px}}
.stage.play .cover{opacity:0;visibility:hidden}
.cover .ck{font:500 11px/1.4 var(--f-sans);letter-spacing:.32em;text-transform:uppercase;color:var(--gold);margin:0;animation:up 1s .2s both}
.cover .cn{font:var(--cover-font);margin:14px 0 0;color:var(--ink);animation:up 1s .45s both}
.cover .cd8{font:400 14px/1 var(--f-sans);letter-spacing:.2em;margin:14px 0 0;color:var(--gold);animation:up 1s .7s both}
.cover button{margin-top:30px;font:500 12.5px/1 var(--f-sans);letter-spacing:.2em;text-transform:uppercase;border:0;border-radius:999px;padding:16px 28px;cursor:pointer;background:var(--btn-bg);color:var(--btn-fg);animation:up 1s .95s both,pulse 2.4s ease-in-out 2s infinite}
.cover button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--gold) 55%,transparent)}50%{box-shadow:0 0 0 14px transparent}}
.dust{position:absolute;bottom:-10px;border-radius:50%;background:var(--dust,var(--gold));opacity:0;pointer-events:none;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}12%{opacity:.85}85%{opacity:.5}100%{transform:translateY(-1100px);opacity:0}}
.replay{margin-top:22px;font:500 11px/1 var(--f-sans);letter-spacing:.16em;text-transform:uppercase;background:none;border:0;cursor:pointer;color:inherit;opacity:.6;padding:8px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

</style>
<main class="stage" id="stage" lang="tr"><div class="cover"><p class="ck">Nişanımıza Davetlisiniz</p><p class="cn">İlayda &amp; Yahya Yasin</p><p class="cd8">27 · 10 · 2026</p><button type="button">Davetiyeyi Aç</button></div>
  <svg class="bot tl" viewBox="0 0 250 250" aria-hidden="true"></svg>
  <svg class="bot br" viewBox="0 0 250 250" aria-hidden="true"></svg>
  <p class="kick rv" style="--d:1.20s">Nişanımıza Davetlisiniz</p>
    <p class="fam rv" style="--d:1.30s">Saran ve Bingöl ailelerinin kıymetli evlatları</p>
    <h1 class="names rv" style="--d:1.45s">İlayda<span>&amp;</span>Yahya Yasin</h1>
    <div class="date rv" style="--d:1.65s"><div class="side">Salı</div><div class="day">27<small>Ekim 2026</small></div><div class="side">19.00</div></div>
    <p class="place rv" style="--d:1.80s">Akman Rönesans</p>
    <p class="addr rv" style="--d:1.85s">Konutkent Mahallesi 2961. Cadde No:1/B<br>Çankaya / Ankara</p>
    <div class="rv" style="--d:1.95s"><a class="btn-loc" href="https://www.google.com/maps/search/?api=1&amp;query=Akman%20R%C3%B6nesans%2C%20Konutkent%20Mahallesi%202961.%20Cadde%20No%3A1%2FB%2C%20%C3%87ankaya%2C%20Ankara" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Konuma Git</a></div>
    <div class="cd rv" style="--d:2.05s"></div>
    <button class="replay rv" style="--d:2.15s" type="button">↺ Tekrar izle</button>
</main>
<script>(function(){var t=new Date('2026-10-27T19:00:00+03:00').getTime(),els=document.querySelectorAll('.cd');function p(n){return n<10?'0'+n:''+n}
function k(){var ms=Math.max(0,t-Date.now()),d=Math.floor(ms/864e5),h=Math.floor(ms/36e5)%24,m=Math.floor(ms/6e4)%60,s=Math.floor(ms/1e3)%60;
var h2=ms>0?'<div><b>'+d+'</b><span>Gün</span></div><div><b>'+p(h)+'</b><span>Saat</span></div><div><b>'+p(m)+'</b><span>Dakika</span></div><div><b>'+p(s)+'</b><span>Saniye</span></div>':'<div><b>♥</b><span>Bugün</span></div>';
els.forEach(function(e){e.innerHTML=h2})}k();setInterval(k,1000)})();
(function(){var NS='http://www.w3.org/2000/svg',seed=5;function r(){seed=seed*16807%2147483647;return (seed-1)/2147483646}
function el(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e}
document.querySelectorAll('.bot').forEach(function(svg,si){
 var defs=el('defs',{},svg);
 var f=el('filter',{id:'wc'+si,x:'-20%',y:'-20%',width:'140%',height:'140%'},defs);
 el('feTurbulence',{type:'fractalNoise',baseFrequency:'.05',numOctaves:'2',seed:String(3+si)},f);el('feDisplacementMap',{'in':'SourceGraphic',scale:'6'},f);
 var g=el('radialGradient',{id:'pg'+si},defs);el('stop',{offset:'0','stop-color':'#c4737f'},g);el('stop',{offset:'.55','stop-color':'#eab4b6'},g);el('stop',{offset:'1','stop-color':'#f8dcdb'},g);
 var g2=el('radialGradient',{id:'wg'+si},defs);el('stop',{offset:'0','stop-color':'#e9cfb8'},g2);el('stop',{offset:'1','stop-color':'#fffaf3'},g2);
 var stems=[["M40 40Q120 70 230 60",0],["M40 40Q70 120 60 230",.2],["M40 40Q130 130 190 170",.4]];
 stems.forEach(function(s){var p=el('path',{d:s[0],'class':'stem',pathLength:'1',style:'animation-delay:'+s[1]+'s'},svg);
   var L=p.getTotalLength?null:null;});
 // okaliptüs yaprakları
 var paths=svg.querySelectorAll('.stem');
 paths.forEach(function(p,pi){var len=p.getTotalLength();for(var i=1;i<9;i++){var t=i/9,pt=p.getPointAtLength(len*t),side=i%2?1:-1;
   var pt2=p.getPointAtLength(Math.min(len,len*t+2)),ang=Math.atan2(pt2.y-pt.y,pt2.x-pt.x)*180/Math.PI+90*side;
   var rr=4+ (1-t)*5+r()*2;
   el('ellipse',{cx:(pt.x+Math.cos(ang*Math.PI/180)*rr).toFixed(1),cy:(pt.y+Math.sin(ang*Math.PI/180)*rr).toFixed(1),rx:rr.toFixed(1),ry:(rr*.82).toFixed(1),fill:r()<.5?'#9fb5ab':'#b3c6bb',opacity:'.9','class':'leaf',filter:'url(#wc'+si+')',style:'animation-delay:'+(.4+pi*.2+t*1.4).toFixed(2)+'s'},svg);}});
 // çiçekler
 function bloom(cx,cy,R,delay,white){var g=el('g',{'class':'bloom',style:'animation-delay:'+delay+'s'},svg);var gi=el('g',{'class':'bloom-in',filter:'url(#wc'+si+')'},g);
   var fill=white?'url(#wg'+si+')':'url(#pg'+si+')';
   for(var ring=0;ring<3;ring++){var n=7-ring,rr=R*(1-ring*.28);for(var k=0;k<n;k++){var a=k/n*Math.PI*2+ring*.4;
     el('ellipse',{cx:(cx+Math.cos(a)*rr*.45).toFixed(1),cy:(cy+Math.sin(a)*rr*.45).toFixed(1),rx:(rr*.55).toFixed(1),ry:(rr*.4).toFixed(1),transform:'rotate('+(a*180/Math.PI).toFixed(0)+' '+(cx+Math.cos(a)*rr*.45).toFixed(1)+' '+(cy+Math.sin(a)*rr*.45).toFixed(1)+')',fill:fill,opacity:(.75+ring*.08).toFixed(2)},gi);}}
   el('circle',{cx:cx,cy:cy,r:(R*.18).toFixed(1),fill:white?'#d9b48a':'#a9555f',opacity:'.8'},gi);}
 bloom(52,52,34,1.2,false);bloom(108,84,22,1.6,true);bloom(70,118,20,1.9,false);bloom(150,58,14,2.2,true);bloom(46,160,13,2.4,true);
 for(var b=0;b<10;b++){el('circle',{cx:(80+r()*120).toFixed(0),cy:(60+r()*110).toFixed(0),r:(1.6+r()*1.6).toFixed(1),fill:'#e8a9ae','class':'leaf',style:'animation-delay:'+(2+r()).toFixed(2)+'s'},svg);}
});
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){var st=document.getElementById('stage');for(var j=0;j<22;j++){var p=document.createElement('span');p.className='petal';p.style.left=(Math.random()*100)+'%';p.style.animationDuration=(12+Math.random()*8)+'s';p.style.animationDelay=(-Math.random()*18)+'s';p.style.setProperty('--dx',(Math.random()*120-60)+'px');p.style.setProperty('--r',(Math.random()*540+180)+'deg');st.appendChild(p);}}
})();
(function(){var st=document.querySelector('.stage'),cv=st.querySelector('.cover');
if(st.dataset.dust){for(var i=0;i<+st.dataset.dust;i++){var d=document.createElement('span');d.className='dust';var z=2+Math.random()*3;d.style.width=d.style.height=z+'px';d.style.left=(Math.random()*100)+'%';d.style.animationDuration=(9+Math.random()*9)+'s';d.style.animationDelay=(-Math.random()*16)+'s';st.appendChild(d);}}
cv.querySelector('button').addEventListener('click',function(){st.classList.add('play');window.scrollTo({top:0,behavior:'smooth'})});
var rp=st.querySelector('.replay');if(rp)rp.addEventListener('click',function(){st.classList.remove('play');
 if(document.getAnimations)document.getAnimations().forEach(function(a){if(a.effect&&a.effect.target&&!cv.contains(a.effect.target)){try{a.cancel();a.play()}catch(e){}}});
 window.scrollTo({top:0})});
})();</script>
</body>
