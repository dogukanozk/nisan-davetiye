<style>
/* Layout: tek sahne; kapalı zarf → mühre dokun → kapak açılır, kart çıkar. Tek tema (kağıt). */
:root{--bg:#e4e6dc;--env:#f1ebdf;--env2:#e6dccb;--env3:#ddd1bc;--paper:#fffdf8;--ink:#34402f;--mute:#7b8174;--gold:#a98a4c;--seal:#6f8566;
--f-script:"Great Vibes","Brush Script MT",cursive;--f-serif:"Cormorant Garamond",Garamond,"Times New Roman",serif;--f-sans:"Jost","Helvetica Neue",Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes drawL{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes glowP{0%,100%{opacity:.6;transform:scale(.96)}50%{opacity:.9;transform:scale(1.04)}}
.tw{animation:tw 2.6s ease-in-out infinite}
.glowC{transform-box:fill-box;transform-origin:center;animation:glowP 3.2s ease-in-out infinite}
.btn-loc{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font:500 12.5px/1 var(--f-sans);letter-spacing:.14em;text-transform:uppercase;padding:14px 22px;border-radius:999px}
.btn-loc svg{width:16px;height:16px}
.btn-loc:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.cd{display:flex;justify-content:center;gap:14px;font-variant-numeric:tabular-nums}
.cd div{display:flex;flex-direction:column;align-items:center;min-width:44px}
.cd span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-top:5px;opacity:.75}

html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
.stage{max-width:440px;margin:0 auto;position:relative;min-height:640px;display:flex;align-items:center;justify-content:center}
.env{position:relative;width:100%;aspect-ratio:1.38;perspective:1000px;transition:transform 1s .5s cubic-bezier(.5,0,.3,1),opacity .7s .7s;filter:drop-shadow(0 16px 26px rgba(52,64,47,.22))}
.env-body{position:absolute;inset:0;background:var(--env);border-radius:6px;overflow:hidden}
.env-body::before{content:"";position:absolute;inset:0;background:var(--env2);clip-path:polygon(0 0,50% 56%,0 100%)}
.env-body::after{content:"";position:absolute;inset:0;background:var(--env2);clip-path:polygon(100% 0,50% 56%,100% 100%)}
.env-front{position:absolute;inset:0;background:var(--env);clip-path:polygon(0 100%,50% 50%,100% 100%);z-index:1}
.env-flap{position:absolute;left:0;right:0;top:0;height:60%;background:var(--env3);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s cubic-bezier(.5,0,.3,1);z-index:3;border-radius:6px 6px 0 0}
.env-label{position:absolute;left:0;right:0;bottom:5%;text-align:center;z-index:2;color:var(--ink)}
.env-label b{display:block;font:400 30px/1.1 var(--f-script);margin-bottom:4px}
.env-label span{font:400 11px/1 var(--f-sans);letter-spacing:.3em;color:var(--gold)}
.mini{position:absolute;left:50%;top:20%;width:30%;transform:translateX(-50%);color:var(--gold);opacity:.55;z-index:0}
.seal{position:absolute;left:50%;top:50%;transform:translate(-50%,-62%);z-index:4;width:60px;height:60px;border-radius:50%;border:0;cursor:pointer;background:radial-gradient(circle at 35% 30%,#8ea383,var(--seal) 60%,#55684d);color:#f3e2b4;font:500 18px/1 var(--f-serif);letter-spacing:.06em;box-shadow:0 4px 10px rgba(0,0,0,.25),inset 0 0 0 5px rgba(0,0,0,.1);transition:opacity .35s,transform .35s;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 4px 10px rgba(0,0,0,.25),0 0 0 0 rgba(111,133,102,.5)}50%{box-shadow:0 4px 10px rgba(0,0,0,.25),0 0 0 14px rgba(111,133,102,0)}}
.tap{position:absolute;left:0;right:0;top:calc(50% + 34vw);text-align:center;font:400 11.5px/1 var(--f-sans);letter-spacing:.24em;text-transform:uppercase;color:var(--mute)}
@media (min-width:480px){.tap{top:calc(50% + 170px)}}
.stage.open .env-flap{transform:rotateX(180deg)}
.stage.open .seal{opacity:0;transform:translate(-50%,-62%) scale(.6);pointer-events:none}
.stage.open .env{transform:translateY(60%);opacity:0;pointer-events:none}
.stage.open .tap{opacity:0}
.card{position:absolute;inset:0;margin:auto;height:max-content;background:var(--paper);text-align:center;padding:30px 24px 30px;box-shadow:0 14px 36px rgba(52,64,47,.18);opacity:0;transform:translateY(40px) scale(.96);transition:opacity .9s .9s,transform 1s .9s cubic-bezier(.2,.7,.2,1);pointer-events:none}
.card::before{content:"";position:absolute;inset:10px;border:1px solid var(--gold);pointer-events:none}
.stage.open .card{position:relative;opacity:1;transform:none;pointer-events:auto}
.stage.open .env-wrap{position:absolute;inset:0;display:flex;align-items:center}
.card .rv{opacity:0}
.stage.open .card .rv{animation:up 1s cubic-bezier(.2,.7,.2,1) calc(var(--d,0s) + 1.6s) both}
.arches{width:84%;display:block;margin:0 auto}
.dr path,.dr ellipse{stroke-dasharray:1;stroke-dashoffset:1}
.stage.open .dr path,.stage.open .dr ellipse{animation:drawL 2.2s 1.1s ease-out forwards}
.stage.open .dr2 path{animation-delay:1.6s}
.stage.open .dr3 path,.stage.open .dr3 ellipse{animation-delay:2.2s}
.glowC,.dots{opacity:0;transition:opacity 1s 2.8s}
.stage.open .glowC,.stage.open .dots{opacity:1}
.kick{font:500 11px/1.4 var(--f-sans);letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin:14px 0 0}
.fam{font:italic 400 18px/1.45 var(--f-serif);margin:12px auto 0;max-width:28ch}
.names{font:400 52px/1.02 var(--f-script);margin:10px 0 0}
.names em{display:block;font:italic 400 21px/1 var(--f-serif);color:var(--gold);margin:4px 0}
.date{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin:22px 0 0}
.date .side{font:500 12px/1.4 var(--f-sans);letter-spacing:.2em;text-transform:uppercase;border-block:1px solid var(--gold);padding:8px 0}
.date .day{font:500 52px/1 var(--f-serif)}
.date .day small{display:block;font:500 11px/1 var(--f-sans);letter-spacing:.24em;text-transform:uppercase;margin-top:5px;color:var(--gold)}
.place{font:600 20px/1.3 var(--f-serif);margin:22px 0 0}
.addr{font:400 13.5px/1.55 var(--f-sans);color:var(--mute);margin:6px 0 0}
.btn-loc{background:var(--seal);color:var(--paper);margin-top:16px}
.cd{margin-top:22px} .cd b{font:500 26px/1 var(--f-serif)}
.again{margin-top:16px;font:500 11px/1 var(--f-sans);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);background:none;border:0;cursor:pointer;padding:8px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (prefers-reduced-motion:reduce){.card .rv,.dr path,.dr ellipse{opacity:1!important;stroke-dashoffset:0!important}}
</style>
